---
# Checks this supplement with Shaffy OS's reusable workflow, against its released main:
# the settings and the home they render, lint, the supplement's own tests and a secret
# scan (.github/workflows/supplement.yml in kromsam/shaffy-os). It needs no secret; a
# SHAFFY_OS_TOKEN secret, if this repository has one, is used to read Shaffy OS instead
# of the run's own token, and a SUBMODULES_TOKEN secret to read this repository with
# submodules of other private repositories, such as the dotfiles.
name: shaffy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  supplement:
    uses: kromsam/shaffy-os/.github/workflows/supplement.yml@main
    secrets:
      SHAFFY_OS_TOKEN: ${{ secrets.SHAFFY_OS_TOKEN }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
