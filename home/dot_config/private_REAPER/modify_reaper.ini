#!/usr/bin/env python3
"""REAPER's audio through PipeWire (the `reaper` integration); everything else is REAPER's.

Before REAPER has written its configuration there is nothing to change, and the
empty output leaves the file for REAPER to create; the next apply sets the keys.
"""
import re
import sys

# PipeWire's ALSA plugin instead of a fixed hw: device. Suspending PulseAudio would
# also suspend PipeWire's desktop compatibility layer.
AUDIO = {'alsa_indev': 'pipewire', 'alsa_outdev': 'pipewire', 'linux_audio_mode': '1',
         'linux_auto_pasuspend': '0'}


def configure(text):
    if not text.strip():
        return text
    for key, value in AUDIO.items():
        text, count = re.subn(r'^' + key + r'=.*$', key + '=' + value, text, flags=re.M)
        if count == 0:
            # REAPER reads section names in any case, and its first run writes [reaper].
            text, added = re.subn(r'^(\[REAPER\])\n', lambda m: f'{m.group(1)}\n{key}={value}\n', text,
                                  count=1, flags=re.M | re.I)
            if not added:
                raise RuntimeError('REAPER configuration without a [REAPER] section; open REAPER once')
    return text


if __name__ == '__main__':
    sys.stdout.write(configure(sys.stdin.read()))
