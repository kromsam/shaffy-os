# Niri's portal preferences (/usr/share/xdg-desktop-portal/niri-portals.conf from
# niri 26.04) with one change: folders are chosen with GTK's file chooser, because
# Nautilus 51.1 crashes under Niri 26.04 when an XWayland application asks for a
# folder (https://github.com/niri-wm/niri/issues/4691). Drop the FileChooser line
# once the running Niri includes fix d054395 and Nautilus's chooser passes the
# check in docs/DESKTOP-SETUP.md ("The folder chooser").
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
