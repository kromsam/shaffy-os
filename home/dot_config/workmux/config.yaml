---
# workmux: one git worktree and tmux window per task, opened with `wm add <branch>`.
# Only the settings below differ from workmux's defaults (`workmux config reference`);
# the window's panes stay workmux's own, and a project's .workmux.yaml may change them.
nerdfont: true
# Naming the agent opens it in every project's window, not only beside a CLAUDE.md.
agent: claude
# mise installs and updates workmux, so no notice suggests `workmux update`, which
# would replace mise's binary in place.
auto_update_check: false
