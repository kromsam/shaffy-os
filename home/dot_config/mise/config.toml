# The tools Shaffy OS's own launchers and helpers run. Personal runtimes belong in the
# supplement's mise fragment, rendered as conf.d/90-supplement.toml, or in a project's mise.toml.
# Public tools follow latest when installed or updated through mise.
[tools]
claude = "latest"
codex = "latest"
# pstack's PR watcher, orchestration store and statechart scripts run on Bun.
bun = "latest"
"aqua:protonpass/pass-cli" = "latest"
"github:raine/workmux" = "latest"
# Zotero MCP with semantic search and PDF reading, on the system Python and CPU-only PyTorch.
"pypi:zotero-mcp-server" = { version = "latest", extras = "semantic,pdf", uvx_args = "--torch-backend cpu --python /usr/bin/python3" }

[settings]
# `latest` is the newest release that is at least three days old, so a
# compromised release is usually withdrawn before an install or upgrade takes it.
minimum_release_age = "3d"

[settings.upgrade]
auto_prune = false
