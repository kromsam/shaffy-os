# Python's lint rules and format (STYLE.md). Single quotes and 120 columns are the code's
# existing look; the rules are an explicit selection, never ALL.
# Always the system Python, the newest the distribution ships: the self-test fails when
# they differ, and scripts/refresh-pins.py raises it.
target-version = "py314"
line-length = 120
# With the other untracked scratch files, never beside the sources.
cache-dir = "artifacts/ruff"

[format]
quote-style = "single"

[lint]
select = [
  "E4", "E7", "E9", "F",  # pyflakes and pycodestyle's errors, ruff's defaults
  "B",                    # bugbear: likely bugs and design problems
  "I",                    # sorted imports
  "UP",                   # syntax the target Python makes simpler
  "PLE",                  # pylint's errors
  "PLW1510",              # subprocess.run states `check`
  "RUF100",               # no unused noqa
]

# Reported, never removed by --fix: an agent adds an import in one edit and the code that
# uses it in the next, and the edit hook must not undo the first in between.
unfixable = ["F401"]

[lint.isort]
# `import x` and `from x import y` sorted together by module, as the code already does.
force-sort-within-sections = true

[lint.per-file-ignores]
# Tests and scripts put lib/ or tests/ on sys.path before importing from them.
"{tests,scripts}/**" = ["E402"]
