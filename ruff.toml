# Python's lint rules and format (STYLE.md). Single quotes and 120 columns are the code's
# existing look; the rules are an explicit selection, never ALL.
# Always the system Python, the newest the distribution ships: the self-test fails when
# they differ, and scripts/refresh-pins.py raises it.
target-version = "py314"
line-length = 120
# With the other untracked scratch files, never beside the sources.
cache-dir = "artifacts/ruff"

[format]
quote-style = "single"

[lint]
select = [
  "E",       # pycodestyle's errors: PEP 8's layout
  "W",       # pycodestyle's warnings: PEP 8's whitespace
  "F",       # pyflakes: likely errors
  "N",       # pep8-naming: PEP 8's names
  "B",       # bugbear: likely bugs and design problems
  "I",       # sorted imports
  "UP",      # syntax the target Python makes simpler
  "C4",      # comprehensions that say what they build
  "SIM",     # simpler control flow
  "PIE",     # unnecessary statements
  "PLE",     # pylint's errors
  "PLW1510", # subprocess.run states `check`
  "RUF",     # ruff's own checks
]
ignore = [
  "RUF012", # wants typing.ClassVar on mutable class attributes; the code carries no type hints
]

# Reported, never removed by --fix: an agent adds an import in one edit and the code that
# uses it in the next, and the edit hook must not undo the first in between.
unfixable = ["F401"]

[lint.pep8-naming]
# unittest's own camelCase hooks, and assertions named after them.
extend-ignore-names = [
  "startTest",
  "addSuccess",
  "addFailure",
  "addError",
  "addSubTest",
  "addSkip",
  "addExpectedFailure",
  "addUnexpectedSuccess",
  "assert*",
]

[lint.isort]
# `import x` and `from x import y` sorted together by module, as the code already does.
force-sort-within-sections = true

[lint.per-file-ignores]
# Tests and scripts put lib/ or tests/ on sys.path before importing from them.
"{tests,scripts}/**" = ["E402"]
