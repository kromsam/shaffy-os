# yaml-language-server: $schema=../schema/supplement.schema.json
# Shaffy OS public defaults. A supplement overrides these; see supplement.example/.
schema_version: 1
ai:
  compound_engineering:
    enabled: true
  mcp_servers:
    # Retirement marker: absence alone would retain an existing client entry.
    gbrain:
      enabled: false
    # Beeper Desktop's own server, while Beeper runs with its Desktop API on.
    beeper:
      url: "http://127.0.0.1:23373/v0/mcp"
    # mise installs the server (home/dot_config/mise/config.toml) and starts it.
    zotero:
      command: "/usr/bin/mise"
      args: ["exec", "pypi:zotero-mcp-server", "--", "zotero-mcp", "serve"]
      env:
        ZOTERO_LOCAL: "true"
        ZOTERO_LOCAL_WRITE: "false"
desktop:
  browser: "zen.desktop"
  # Noctalia's own wallpaper, which the noctalia package installs.
  wallpaper:
    directory: "/usr/share/noctalia/assets"
    image: "/usr/share/noctalia/assets/noctalia-wallpaper.png"
  lock_screen:
    image: "/usr/share/noctalia/assets/noctalia-wallpaper.png"
