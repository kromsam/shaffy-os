# Writing and research. English spelling and hyphenation; a supplement adds its
# languages' packages with packages.extra.
packages:
  - zettlr
  - pandoc-cli
  - qpdf
  - texlive-meta
  - texlive-langeuropean
  - texlive-langcyrillic
  - libreoffice-fresh
  - hunspell-en_gb
  - hyphen-en
  - vale
  - harper
  - otf-fira-sans
  - ttf-firacode-nerd
  - zotero
required:
  # The role selects LibreOffice's Tabbed interface in the target user's profile.
  - libreoffice-fresh
