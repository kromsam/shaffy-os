# Development base and native audio.
packages:
  - docker
  - docker-compose
  - docker-buildx
  - mise
  - base-devel
  - libyaml
  - libffi
  - openssl
  - readline
  - gmp
  - rustup
  - postgresql-libs
  - mariadb-libs
  - libvips
  - reaper
