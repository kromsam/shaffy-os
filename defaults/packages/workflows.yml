---
# Development base and native audio.
packages:
  - docker
  - docker-compose
  - docker-buildx
  # Rootless Docker's network driver; RootlessKit's fallback cannot keep containers off the host's loopback.
  - slirp4netns
  - mise
  - base-devel
  - reaper
  # Wine and the dependencies of the reviewed yabridge source, for Windows audio plugins in REAPER.
  - wine-staging
  - yabridgectl
  - asio
  - bitsery
  - clap
  - cmake
  - function2
  - ghc-filesystem
  - libxcb
  - meson
  - tomlplusplus
aur:
  # Arch's docker package leaves out Moby's rootless launcher and its user units.
  - name: docker-rootless-extras
required:
  # The home enables the rootless engine's user service, which needs these to run and to isolate.
  - docker
  - docker-rootless-extras
  - slirp4netns
