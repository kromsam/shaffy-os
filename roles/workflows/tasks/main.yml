---
- name: Install the workflow packages through the configured repository priority
  community.general.pacman:
    name: "{{ shaffy.packages.groups.workflows }}"
    state: present
- name: Give Docker's data a subvolume before the rootless engine can first start
  ansible.builtin.import_tasks: docker-data.yml
- name: Install the rootless Docker launcher that comes from the AUR
  ansible.builtin.include_role:
    name: aur_package
  loop: "{{ shaffy.packages.aur.workflows }}"
  loop_control:
    loop_var: aur_package
# Docker runs rootless, as the target user's own service, which the home enables. The system
# engine stays disabled on a fresh installation, so this task only retires the one an earlier
# Shaffy OS enabled. Its data and /etc/docker/daemon.json stay for the owner to copy and delete:
# started again to rescue something, the old engine must still publish ports on loopback only.
# Remove after 2027-02-06, with its test in tests/test_system_roles.py and the marked passage
# on moving to the rootless engine in docs/DESKTOP-APPLICATIONS.md.
- name: Stop and disable the system Docker engine, the socket first so it cannot restart the service
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [docker.socket, docker.service]
