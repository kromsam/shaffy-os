---
- name: Add no firewall opening without localsend settings
  ansible.builtin.meta: end_role
  when: "'localsend' not in shaffy['settings']"

# community.general.ufw sets a state; only the command reads it.
- name: Require an active firewall
  ansible.builtin.command:
    argv: [ufw, status]
  environment:
    LC_ALL: C
  register: __localsend_firewall
  changed_when: false
  failed_when: "__localsend_firewall['rc'] != 0 or 'Status: active' not in __localsend_firewall['stdout']"
  check_mode: false

# Port 53317 carries both the multicast discovery (UDP) and the transfers (TCP).
# An identical rule with another comment is updated in place.
- name: Allow LocalSend only from the configured network and interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ shaffy['settings']['localsend']['interface'] }}"
    from_ip: "{{ shaffy['settings']['localsend']['subnet'] }}"
    to_ip: any
    to_port: "53317"
    proto: "{{ item }}"
    comment: shaffy LocalSend
  loop: [tcp, udp]
