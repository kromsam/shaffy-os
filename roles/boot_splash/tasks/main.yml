---
# The Plymouth theme desktop.boot_splash names: Shaffy OS's own by default, false for none.
- name: Leave the boot splash alone when the supplement sets false
  ansible.builtin.meta: end_role
  when: shaffy.settings.desktop.boot_splash is not string

- name: Install the CachyOS theme the shaffy-os splash takes its spinner and password prompt from
  community.general.pacman:
    name: "{{ shaffy.packages.groups.boot_splash }}"
    state: present

# scripts/configure-boot-splash.py installs shaffy-os when it is the theme, selects the theme in
# /etc/plymouth/plymouthd.conf and, after a change, rebuilds the boot images with limine-mkinitcpio.
- name: Install and select the boot splash, and rebuild the boot images after a change
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - "{{ boot_splash_script }}"
      - "{{ ansible_check_mode | ternary('--check', '--apply') }}"
      - --theme
      - "{{ shaffy.settings.desktop.boot_splash }}"
      - --state-dir
      - "{{ boot_splash_state_dir }}"
      - --source
      - "{{ role_path }}/files/shaffy-os"
  check_mode: false
  register: boot_splash_result
  changed_when: "'changed: 1' in boot_splash_result.stdout"
