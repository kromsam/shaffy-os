---
# The root steps are root_op.py's, run from root's own copy.
- name: finish | Take the post snapshots, record completion and release the system lock
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/python3', '-I', __operation_root_op_dir + '/root_op.py', 'finish', '--op', shaffy_system['op'],
              '--uid', shaffy_system['target']['uid'] | string] + __operation_root_test_arguments }}"
  changed_when: false
