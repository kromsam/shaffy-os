---
# The wrapper passes the operation in one JSON environment variable, read with a
# lookup, so its values stay literal: a path that happens to contain `{{` is data.
shaffy_system: "{{ lookup('ansible.builtin.env', 'SHAFFY_SYSTEM', default='{}') | from_json }}"
shaffy_root_state: "{{ shaffy_system.test.state_dir | default('/var/lib/shaffy') }}"
shaffy_root_op_dir: "{{ shaffy_root_state }}/ops/{{ shaffy_system.op }}"
# Only a container test passes `test`; root_op.py refuses it elsewhere.
shaffy_root_test_arguments: "{{ (['--test-prerequisites', shaffy_system.test.prerequisites,
  '--state-dir', shaffy_system.test.state_dir] if shaffy_system.test is defined else [])
  + (['--test-fault', shaffy_system.test.fault] if shaffy_system.test.fault | default('') else []) }}"
