---
- name: configure | Inspect the current managed policy
  ansible.builtin.stat:
    path: "{{ power_config_dir }}/90-shaffy-critical-battery.conf"
    checksum_algorithm: sha256
  register: __power_current_policy

# Written before the policy: a resumed apply must reload even if its file is
# already correct. The system operation has created the root-owned state directory.
- name: configure | Record a required reload before changing the policy
  ansible.builtin.copy:
    dest: "{{ power_state_dir }}/power-reload-pending"
    content: "Managed by Shaffy OS (power role); remove only after UPower restarts.\n"
    owner: root
    group: root
    mode: "0644"
  when: >-
    (__power_current_policy['stat']['checksum'] | default('')) !=
    ((lookup('template', 'critical-battery.conf.j2') | hash('sha256'))
    if __power_hibernate | length > 0 else '')

- name: configure | Create the UPower override directory when the policy is requested
  ansible.builtin.file:
    path: "{{ power_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: __power_hibernate | length > 0

- name: configure | Hibernate directly at the configured battery level
  ansible.builtin.template:
    src: critical-battery.conf.j2
    dest: "{{ power_config_dir }}/90-shaffy-critical-battery.conf"
    owner: root
    group: root
    mode: "0644"
  when: __power_hibernate | length > 0

- name: configure | Remove only the Shaffy override when the policy is no longer requested
  ansible.builtin.file:
    path: "{{ power_config_dir }}/90-shaffy-critical-battery.conf"
    state: absent
  when: __power_hibernate | length == 0

- name: configure | Check for a pending reload including an interrupted apply
  ansible.builtin.stat:
    path: "{{ power_state_dir }}/power-reload-pending"
  register: __power_reload_pending

- name: configure | Load the changed battery policy
  ansible.builtin.systemd_service:
    name: upower.service
    state: restarted
  when: __power_reload_pending['stat']['exists']

- name: configure | Clear the completed reload
  ansible.builtin.file:
    path: "{{ power_state_dir }}/power-reload-pending"
    state: absent
