---
# pacman -Q answers for one package; package_facts would gather every package.
- name: preflight | Read the installed UPower version
  ansible.builtin.command:
    argv: [pacman, -Q, upower]
  register: __power_upower_package
  changed_when: false

- name: preflight | Require UPower configuration drop-in support
  ansible.builtin.assert:
    that: __power_upower_package['stdout'].split()[1].split('-')[0] is version('1.91.0', '>=')
    fail_msg: Low-battery hibernation needs UPower 1.91.0 or later for configuration drop-ins.
    quiet: true

# No module asks logind.
- name: preflight | Ask logind whether this running boot can hibernate
  ansible.builtin.command:
    argv:
      - busctl
      - --system
      - --json=short
      - call
      - org.freedesktop.login1
      - /org/freedesktop/login1
      - org.freedesktop.login1.Manager
      - CanHibernate
  register: __power_can_hibernate
  changed_when: false

- name: preflight | Require available hibernation before installing an automatic action
  ansible.builtin.assert:
    that: (__power_can_hibernate['stdout'] | from_json)['data'] == ['yes']
    fail_msg: Set up disk-backed swap and resume, reboot, and test hibernation before enabling this policy.
    quiet: true
