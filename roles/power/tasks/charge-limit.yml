---
# scripts/configure-charge-limit.py writes UPower's hardware-database entry and switches
# the limit; without the setting it removes only what it made.
- name: Hold the batteries to the supplement's charge limit through UPower
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '-I', power_charge_limit_script, ansible_check_mode | ternary('--check', '--apply'),
          '--hwdb-dir', power_hwdb_dir, '--state-dir', power_state_dir]
         + (['--end', power_charge_limit.end | string] if power_charge_limit else [])
         + (['--start', power_charge_limit.start | string] if power_charge_limit.start is defined else []) }}
  check_mode: false
  register: power_charge_limit_result
  changed_when: "'changed: 1' in power_charge_limit_result.stdout"
