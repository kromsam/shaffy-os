---
- name: Install phone file browsing and file chooser support
  community.general.pacman:
    name: "{{ shaffy['packages']['groups']['kde_connect'] }}"
    state: present

- name: Add no firewall opening without kde_connect settings
  ansible.builtin.meta: end_role
  when: "'kde_connect' not in shaffy['settings']"

# community.general.ufw sets a state; only the command reads it.
- name: Require an active firewall
  ansible.builtin.command:
    argv: [ufw, status]
  environment:
    LC_ALL: C
  register: __kde_connect_firewall
  changed_when: false
  failed_when: "__kde_connect_firewall['rc'] != 0 or 'Status: active' not in __kde_connect_firewall['stdout']"
  check_mode: false

# An identical rule with another comment is updated in place.
- name: Allow KDE Connect only from the configured network and interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ shaffy['settings']['kde_connect']['interface'] }}"
    from_ip: "{{ shaffy['settings']['kde_connect']['subnet'] }}"
    to_ip: any
    to_port: "1714:1764"
    proto: "{{ item }}"
    comment: shaffy KDE Connect
  loop: [tcp, udp]
