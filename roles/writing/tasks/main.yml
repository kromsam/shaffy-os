---
- name: Install the writing packages from the current synchronized databases
  community.general.pacman:
    name: "{{ shaffy['packages']['groups']['writing'] }}"
    state: present

# The repository's script: no module edits a LibreOffice profile.
- name: Select the Tabbed LibreOffice interface in the target user's profile
  become: true
  become_user: "{{ shaffy_target_user }}"
  environment:
    HOME: "{{ shaffy_target_home }}"
    XDG_CONFIG_HOME: "{{ shaffy_target_home }}/.config"
    XDG_STATE_HOME: "{{ shaffy_target_home }}/.local/state"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ playbook_dir }}/scripts/configure-libreoffice.py"
      - "{{ ansible_check_mode | ternary('--check', '--apply') }}"
  check_mode: false
  register: __writing_libreoffice_layout
  changed_when: >-
    'configuration_changed: 1' in __writing_libreoffice_layout['stdout'] or
    (ansible_check_mode and 'LibreOffice layout needs attention' in __writing_libreoffice_layout['stderr'])
  failed_when:
    - __writing_libreoffice_layout['rc'] != 0
    - >-
      not (ansible_check_mode and __writing_libreoffice_layout['rc'] == 1 and
      'LibreOffice layout needs attention' in __writing_libreoffice_layout['stderr'])
