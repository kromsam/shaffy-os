---
# Promote an existing encrypted keyring to the `login` collection that the login
# role's PAM handoff unlocks. GNOME Keyring must not be running while its file is
# renamed, so a unit does it at the next boot, before SDDM. Runs only when named:
# ./bin/shaffy apply --system --tags login_keyring_migration. Once the login
# collection exists, running it again removes the unit and helper.
- name: Check every login prerequisite first, except the migration this role prepares
  ansible.builtin.import_role:
    name: login
    tasks_from: preflight
  vars:
    login_keyring_migrating: true
    login_autologin: false

- name: Read the keyring directory
  ansible.builtin.stat:
    path: '{{ shaffy_target_home }}/.local/share/keyrings/{{ item }}'
  loop: [default, login.keyring]
  register: login_keyring_migration_files

- name: Require a keyring to migrate or a finished migration
  ansible.builtin.assert:
    that: login_keyring_migration_files.results[0].stat.isreg | default(false) or login_keyring_migration_files.results[1].stat.exists
    fail_msg: '{{ shaffy_target_home }}/.local/share/keyrings has no default keyring; a first login creates
      the login keyring directly, and there is nothing to migrate.'

- name: Read which keyring is the default
  ansible.builtin.slurp:
    src: '{{ shaffy_target_home }}/.local/share/keyrings/default'
  register: login_keyring_migration_default_name
  when: login_keyring_migration_files.results[0].stat.isreg | default(false)

# Finished means login.keyring is the default (or the only keyring), as the helper checks.
- name: Decide whether the migration is finished
  ansible.builtin.set_fact:
    login_keyring_migration_done: >-
      {{ login_keyring_migration_files.results[1].stat.exists and (login_keyring_migration_default_name is skipped
         or (login_keyring_migration_default_name.content | b64decode | trim) == 'login') }}

- name: Refuse a half-finished migration
  ansible.builtin.assert:
    that: login_keyring_migration_done | bool or not login_keyring_migration_files.results[1].stat.exists
    fail_msg: login.keyring exists, but the default keyring is another one, so the migration is
      half-finished and the helper refuses it. Review ~/.local/share/keyrings with the keyring daemon
      stopped before running this again (docs/LOGIN-KEYRING.md).

- name: Prepare the migration for the next boot
  when: not login_keyring_migration_files.results[1].stat.exists
  block:
    - name: Create the helper directory
      ansible.builtin.file:
        path: /usr/local/lib/shaffy
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the guarded migration helper
      ansible.builtin.copy:
        src: prepare-login-keyring.py
        dest: /usr/local/lib/shaffy/prepare-login-keyring.py
        owner: root
        group: root
        mode: '0755'

    - name: Install the pre-login migration unit
      ansible.builtin.template:
        src: shaffy-login-keyring.service.j2
        dest: /etc/systemd/system/shaffy-login-keyring.service
        owner: root
        group: root
        mode: '0644'

    - name: Order the migration before SDDM
      ansible.builtin.copy:
        content: |
          # The one-time keyring migration (login_keyring_migration) runs before SDDM.
          [Unit]
          Wants=shaffy-login-keyring.service
          After=shaffy-login-keyring.service
        dest: /etc/systemd/system/sddm.service.d/21-shaffy-keyring-migration.conf
        owner: root
        group: root
        mode: '0644'

    - name: Load the next-boot configuration without restarting the desktop
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Say what happens next
      ansible.builtin.debug:
        msg: The keyring is promoted at the next boot, before SDDM starts. Reboot, then run this tag
          again to remove the migration unit.

- name: Remove the migration once the login collection is the default
  when: login_keyring_migration_done | bool
  block:
    - name: Remove the migration unit, its ordering and its helper
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/systemd/system/sddm.service.d/21-shaffy-keyring-migration.conf
        - /etc/systemd/system/shaffy-login-keyring.service
        - /usr/local/lib/shaffy/prepare-login-keyring.py
      register: login_keyring_migration_removed

    # Now rather than in a handler: an apply stopped before the handlers would leave the change unloaded.
    - name: Load the configuration without the migration
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: login_keyring_migration_removed.changed  # noqa: no-handler
