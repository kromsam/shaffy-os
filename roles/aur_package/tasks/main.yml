---
# pacman -Q answers for one package; package_facts would gather every package.
- name: Check the installed {{ aur_package['name'] }}
  ansible.builtin.command:
    argv: ["pacman", "-Q", "{{ aur_package['name'] }}"]
  register: __aur_package_installed
  changed_when: false
  failed_when: __aur_package_installed['rc'] not in [0, 1]
  check_mode: false

- name: Build and install a missing AUR package, {{ aur_package['name'] }}
  when: __aur_package_installed['rc'] == 1
  vars:
    # Where the build must have put it: runuser sets HOME from the target user's account.
    __aur_package_out: "{{ shaffy_target_home }}/.cache/shaffy/build/{{ aur_package['name'] }}/out"
    __aur_package_script: "{{ shaffy_system['checkout'] }}/scripts/build-aur-package.sh"
  block:
    # No module builds from the AUR, and makepkg refuses to run as root: the repository's
    # script runs as the target user.
    - name: Fetch the AUR recipe as the target user, of {{ aur_package['name'] }}
      ansible.builtin.command:
        argv: ["runuser", "--user", "{{ shaffy_target_user }}", "--", "/usr/bin/bash",
               "{{ __aur_package_script }}", "fetch", "{{ aur_package['name'] }}"]
      register: __aur_package_fetch
      changed_when: false

    - name: Record the recipe's commit and dependencies
      ansible.builtin.set_fact:
        __aur_package_recipe: "{{ __aur_package_fetch['stdout_lines'][-1] | from_json }}"

    - name: Install the repository packages the recipe needs
      community.general.pacman:
        name: "{{ __aur_package_recipe['depends'] }}"
        state: present
        extra_args: --asdeps
      when: __aur_package_recipe['depends'] | length > 0

    # makepkg refuses to run as root.
    - name: Build the package as the target user, {{ aur_package['name'] }}
      ansible.builtin.command:
        argv: ["runuser", "--user", "{{ shaffy_target_user }}", "--", "/usr/bin/bash",
               "{{ __aur_package_script }}", "build", "{{ aur_package['name'] }}", "{{ __aur_package_recipe['commit'] }}"]
      register: __aur_package_build
      changed_when: true

    - name: Record the built package and its digest
      ansible.builtin.set_fact:
        __aur_package_built: "{{ __aur_package_build['stdout_lines'][-1] | from_json }}"

    - name: Require the package where the build must put it
      ansible.builtin.assert:
        that:
          - __aur_package_built['path'] | dirname == __aur_package_out
          - (__aur_package_built['path'] | basename).startswith(aur_package['name'] + '-')
        fail_msg: "The build reported {{ __aur_package_built['path'] }}, not a package in {{ __aur_package_out }}."
        quiet: true

    - name: Inspect the built package without following links
      ansible.builtin.stat:
        path: "{{ __aur_package_built['path'] }}"
        follow: false
        get_checksum: false
      register: __aur_package_source

    - name: Require a regular file the target user built
      ansible.builtin.assert:
        that:
          - __aur_package_source['stat']['isreg'] | default(false)
          - __aur_package_source['stat']['pw_name'] == shaffy_target_user
        fail_msg: "The built {{ aur_package['name'] }} is not a regular file owned by {{ shaffy_target_user }}."
        quiet: true

    - name: Keep the package copies in the root-owned operation directory
      ansible.builtin.file:
        path: "{{ shaffy_op_dir }}/packages"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy the package into the operation directory, {{ aur_package['name'] }}
      ansible.builtin.copy:
        src: "{{ __aur_package_built['path'] }}"
        dest: "{{ shaffy_op_dir }}/packages/{{ __aur_package_built['path'] | basename }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      register: __aur_package_copy

    - name: Read the digest of the root copy
      ansible.builtin.stat:
        path: "{{ __aur_package_copy['dest'] }}"
        checksum_algorithm: sha256
      register: __aur_package_stat

    - name: Require the digest the build recorded
      ansible.builtin.assert:
        that: __aur_package_stat['stat']['checksum'] == __aur_package_built['sha256']
        fail_msg: "The copy of {{ aur_package['name'] }} differs from what the build produced."
        quiet: true

    # No module reads a package file's name and version.
    - name: Read the name and version in the copy
      ansible.builtin.command:
        argv: ["pacman", "-Qp", "{{ __aur_package_copy['dest'] }}"]
      register: __aur_package_identity
      changed_when: false
      failed_when: __aur_package_identity['rc'] != 0 or __aur_package_identity['stdout'].split()[0] != aur_package['name']

    - name: Record the recipe commit and digest beside root's copy
      ansible.builtin.copy:
        content: "{{ {'name': aur_package['name'], 'version': __aur_package_identity['stdout'].split()[1],
                      'aur_commit': __aur_package_recipe['commit'], 'sha256': __aur_package_built['sha256'],
                      'file': __aur_package_copy['dest'] | basename} | to_nice_json }}\n"
        dest: "{{ shaffy_op_dir }}/packages/{{ aur_package['name'] }}.json"
        owner: root
        group: root
        mode: "0600"

    # community.general.pacman could install the file; it stays a command until a test covers the switch.
    - name: Install the verified copy of {{ aur_package['name'] }}
      ansible.builtin.command:
        argv: ["pacman", "-U", "--needed", "--noconfirm", "{{ __aur_package_copy['dest'] }}"]
      changed_when: true
