---
# The repository's scripts: no module sets the desktop's default applications.
- name: Manage selected browser associations in the target user's desktop profile
  become: true
  become_user: "{{ shaffy_target_user }}"
  environment:
    HOME: "{{ shaffy_target_home }}"
    XDG_CONFIG_HOME: "{{ shaffy_target_home }}/.config"
    XDG_CURRENT_DESKTOP: niri
  ansible.builtin.command:
    argv:
      - /usr/bin/bash
      - "{{ playbook_dir }}/scripts/configure-web-browser.sh"
      - "{{ ansible_check_mode | ternary('--check', '--apply') }}"
      - "{{ shaffy['settings']['desktop']['browser'] }}"
  check_mode: false
  register: __browser_result
  changed_when: >-
    'configuration_changed: 1' in __browser_result['stdout'] or
    (ansible_check_mode and 'Browser defaults need attention' in __browser_result['stderr'])
  failed_when:
    - __browser_result['rc'] != 0
    - >-
      not (ansible_check_mode and __browser_result['rc'] == 1 and
      'Browser defaults need attention' in __browser_result['stderr'])

- name: Keep Office documents, CSV and TSV opening in LibreOffice instead of ChatGPT
  become: true
  become_user: "{{ shaffy_target_user }}"
  environment:
    HOME: "{{ shaffy_target_home }}"
    XDG_CONFIG_HOME: "{{ shaffy_target_home }}/.config"
    XDG_CURRENT_DESKTOP: niri
  ansible.builtin.command:
    argv:
      - /usr/bin/bash
      - "{{ playbook_dir }}/scripts/configure-office-apps.sh"
      - "{{ ansible_check_mode | ternary('--check', '--apply') }}"
  check_mode: false
  register: __browser_office_result
  changed_when: >-
    'configuration_changed: 1' in __browser_office_result['stdout'] or
    (ansible_check_mode and 'Office defaults need attention' in __browser_office_result['stderr'])
  failed_when:
    - __browser_office_result['rc'] != 0
    - >-
      not (ansible_check_mode and __browser_office_result['rc'] == 1 and
      'Office defaults need attention' in __browser_office_result['stderr'])
