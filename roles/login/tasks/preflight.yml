---
# Every login and keyring prerequisite, checked before the first autologin or PAM write.
# These tasks only read, and only matter when automatic login is requested.
- name: preflight | Read the Niri session definition
  ansible.builtin.stat:
    path: /usr/share/wayland-sessions/niri.desktop
  register: __login_niri_session
  when: __login_autologin | bool

- name: preflight | Require Niri to be installed
  ansible.builtin.assert:
    that: __login_niri_session['stat']['isreg'] | default(false)
    fail_msg: Niri's session file is missing; install Niri before configuring its automatic login.
  when: __login_autologin | bool

- name: preflight | Read the target user's account
  ansible.builtin.getent:
    database: passwd
    key: "{{ shaffy_target_user }}"
    fail_key: false
  when: __login_autologin | bool

- name: preflight | Require the automatic login's user to exist
  ansible.builtin.assert:
    that: (ansible_facts['getent_passwd'][shaffy_target_user] | default(none)) is not none
    fail_msg: There is no account named {{ shaffy_target_user }} to log in automatically.
  when: __login_autologin | bool

- name: preflight | Check the installed password handoff modules
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/lib/security/pam_systemd_loadkey.so
    - /usr/lib/security/pam_gnome_keyring.so
  register: __login_keyring_modules
  when: __login_autologin | bool

- name: preflight | Require both supported PAM modules
  ansible.builtin.assert:
    that: item['stat']['isreg'] | default(false)
    quiet: true
  loop: "{{ __login_keyring_modules['results'] }}"
  loop_control:
    label: "{{ item['item'] }}"
  when: __login_autologin | bool

- name: preflight | Read the existing SDDM automatic login PAM stack
  ansible.builtin.slurp:
    src: /etc/pam.d/sddm-autologin
  register: __login_sddm_autologin_pam
  when: __login_autologin | bool

- name: preflight | Require the existing optional keyring hooks before editing PAM
  vars:
    __login_autologin_stack: "{{ __login_sddm_autologin_pam['content'] | b64decode }}"
  ansible.builtin.assert:
    that:
      - "(__login_autologin_stack | regex_findall('(?m)^-?auth[ \\t]+optional[ \\t]+pam_gnome_keyring\\.so[ \\t]*$') | length) == 1"
      - "(__login_autologin_stack | regex_findall('(?m)^-?session[ \\t]+optional[ \\t]+pam_gnome_keyring\\.so[ \\t]+auto_start[ \\t]*$') | length) == 1"
  when: __login_autologin | bool

- name: preflight | Read whether the target user has a default keyring
  ansible.builtin.stat:
    path: "{{ shaffy_target_home }}/.local/share/keyrings/default"
  register: __login_keyring_alias
  when: __login_autologin | bool

- name: preflight | Read which keyring is the default
  ansible.builtin.slurp:
    src: "{{ shaffy_target_home }}/.local/share/keyrings/default"
  register: __login_keyring_default
  when:
    - __login_autologin | bool
    - __login_keyring_alias['stat']['isreg'] | default(false)

# Automatic login unlocks only login.keyring; with another default keyring the first
# login would create an empty login keyring beside it.
- name: preflight | Require the default keyring to be the login keyring
  ansible.builtin.assert:
    that: not (__login_keyring_alias['stat']['isreg'] | default(false)) or (__login_keyring_default['content'] | b64decode | trim) == 'login'
    fail_msg: >-
      The default keyring of {{ shaffy_target_user }} is not the login keyring, which automatic login
      unlocks. Rename it to login.keyring by hand first, with the keyring daemon stopped
      (docs/LOGIN-KEYRING.md).
  when: __login_autologin | bool

# Automatic login skips the password, so only disk encryption keeps the desktop closed.
- name: preflight | Read the mounted filesystems when the play has not
  ansible.builtin.setup:
    gather_subset: [mounts]
  when:
    - __login_autologin | bool
    - "'mounts' not in ansible_facts"

# No module lists the device types beneath a device. The root filesystem's is the last
# mount on /, as findmnt would name it.
- name: preflight | Read the device types beneath the root filesystem
  ansible.builtin.command:
    argv: [lsblk, --noheadings, --inverse, --output, TYPE,
           "{{ (ansible_facts['mounts'] | selectattr('mount', 'match', '^/$') | last)['device'] }}"]
  register: __login_root_types
  changed_when: false
  check_mode: false
  when: __login_autologin | bool

- name: preflight | Require an encrypted root filesystem for automatic login
  ansible.builtin.assert:
    that: "'crypt' in (__login_root_types['stdout_lines'] | map('trim') | list)"
    fail_msg: Automatic login needs / on an encrypted device, since nothing else asks for a password
      before the desktop opens. Encrypt the disk, or leave login.autologin unset.
  when: __login_autologin | bool
