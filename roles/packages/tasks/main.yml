---
# community.general.pacman expands a group to its members; pacman -Sg tells them apart.
- name: Look up which listed names are pacman groups
  ansible.builtin.command:
    argv: "{{ ['pacman', '-Sg'] + shaffy['packages']['extra'] + shaffy['packages']['remove'] }}"
  register: __packages_groups
  changed_when: false
  failed_when: false
  check_mode: false
  when: (shaffy['packages']['extra'] + shaffy['packages']['remove']) | length > 0

- name: Refuse group names, which pacman would expand to every member
  ansible.builtin.assert:
    that: __packages_groups['stdout'] | default('') | length == 0
    fail_msg: >-
      These names are pacman groups, not packages; list the packages instead:
      {{ __packages_groups['stdout_lines'] | default([]) | map('split') | map('first') | unique | join(', ') }}
    quiet: true

- name: Install the packages the settings add
  community.general.pacman:
    name: "{{ shaffy['packages']['extra'] }}"
    state: present
  when: shaffy['packages']['extra'] | length > 0

- name: Remove retired packages and those the settings remove
  community.general.pacman:
    name: "{{ shaffy['packages']['remove'] }}"
    state: absent
  when: shaffy['packages']['remove'] | length > 0
