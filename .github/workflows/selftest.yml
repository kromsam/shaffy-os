---
# Runs the linters, the fresh-clone-safe tests, a secret scan of the history and the
# REUSE licence check, plus the system operation tests in a disposable container. CI
# never sees a private supplement.
name: selftest
on:
  # A release tag names a commit that dev and main have already tested.
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push supersedes a run still in progress, except on main, where every run finishes.
  group: selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  selftest:
    # main and dev are tested by their push; every other pull request, from a fork or a branch here, runs.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["main", "dev"]'), github.head_ref)
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos@sha256:f645eba0ce0240b6a26c273b4542d463e734cc68bbd50d988964e3edbb037e5f
    steps:
      - name: Install the test toolset
        run: >-
          pacman -Syu --needed --noconfirm git python python-yaml python-jsonschema python-jinja
          chezmoi niri noctalia fish tmux base-devel wayland libxkbcommon
          mise uv gitleaks reuse xdg-user-dirs desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans every commit
          persist-credentials: false
      # Each step starts in the workspace, and runuser without -l keeps that directory.
      - name: Install the declared Ansible controller and collections
        run: |
          useradd --create-home tester
          chown -R tester: "$GITHUB_WORKSPACE"
          runuser -u tester -- env HOME=/home/tester sh -eu -c '
            mise trust mise.toml
            mise install ansible-core
            mise exec ansible-core -- ansible-galaxy collection install -r requirements.yml -p collections
          '
      - name: Install the development tools (mise.dev.toml)
        run: |
          runuser -u tester -- env HOME=/home/tester MISE_ENV=dev sh -eu -c '
            mise trust mise.dev.toml
            mise install
          '
      - name: Lint (STYLE.md)
        run: runuser -u tester -- env HOME=/home/tester ./bin/shaffy lint
      # The checks after the lint run also after a failure, so one run reports them all.
      - name: Run the tests as an unprivileged user
        if: ${{ !cancelled() }}
        env:
          # The container is disposable, so the home render runs without bubblewrap.
          SHAFFY_RENDER_DIRECT: "1"
        run: runuser -u tester -- env HOME=/home/tester mise exec ansible-core -- ./bin/shaffy selftest --skip-host -v
      - name: Scan the history for secrets
        if: ${{ !cancelled() }}
        run: runuser -u tester -- gitleaks git --redact --no-banner .
      - name: Check copyright and licence information
        if: ${{ !cancelled() }}
        run: runuser -u tester -- reuse lint

  system:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["main", "dev"]'), github.head_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise system applies and recovery in a disposable CachyOS container
        env:
          SHAFFY_CONTAINER_TESTS: "1"
        run: python3 -m unittest discover -s tests -p test_system_container.py -v
