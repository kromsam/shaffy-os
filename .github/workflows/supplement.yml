---
# Checks a private supplement against a Shaffy OS release, as this repository checks
# itself: its settings and the home they render, `shaffy lint --supplement`, the
# supplement's own tests and a secret scan of its history. A supplement calls it from a
# workflow of its own (supplement.example/.github/workflows/shaffy.yml); it runs in the
# supplement's repository, so its private files never reach this one.
name: supplement
on:
  workflow_call:
    inputs:
      shaffy-ref:
        description: The Shaffy OS branch or tag to check against
        type: string
        default: main
    secrets:
      SHAFFY_OS_TOKEN:
        description: Optional; a read-only token for kromsam/shaffy-os, used instead of the run's own token
        required: false
      SUBMODULES_TOKEN:
        description: >-
          Optional; a read-only token for the supplement and its submodules, such as a dotfiles folder kept
          as a submodule of another private repository, used instead of the run's own token
        required: false
permissions:
  contents: read
jobs:
  supplement:
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos@sha256:f645eba0ce0240b6a26c273b4542d463e734cc68bbd50d988964e3edbb037e5f
    steps:
      - name: Install the toolset
        run: >-
          pacman -Syu --needed --noconfirm git python python-yaml python-jsonschema
          chezmoi niri noctalia fish tmux base-devel wayland libxkbcommon
          mise uv gitleaks xdg-user-dirs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: supplement
          fetch-depth: 0 # gitleaks scans every commit
          # A dotfiles folder may be a submodule; the run's own token reads only this repository.
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          # No later step needs the token; a script in the supplement must not find it in .git.
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kromsam/shaffy-os
          ref: ${{ inputs.shaffy-ref }}
          path: shaffy-os
          fetch-depth: 0 # the release tags, which a supplement's minimum_release is checked against
          # The run's own token unless the caller passes SHAFFY_OS_TOKEN.
          token: ${{ secrets.SHAFFY_OS_TOKEN || github.token }}
          persist-credentials: false
      # runuser without -l keeps the step's directory.
      - name: Install the development tools (mise.dev.toml)
        working-directory: shaffy-os
        run: |
          useradd --create-home tester
          chown -R tester: "$GITHUB_WORKSPACE"
          runuser -u tester -- env HOME=/home/tester MISE_ENV=dev sh -eu -c '
            mise trust mise.toml
            mise trust mise.dev.toml
            mise install
          '
      - name: Validate the settings and render the home
        working-directory: shaffy-os
        env:
          # The container is disposable, so the home render runs without bubblewrap.
          SHAFFY_RENDER_DIRECT: "1"
        # --no-home: CI's fresh home has none of the folders or files an installation has.
        run: runuser -u tester -- env HOME=/home/tester ./bin/shaffy check --no-home --supplement ../supplement
      # The checks after the first run also after a failure, so one run reports them all.
      - name: Lint (STYLE.md)
        if: ${{ !cancelled() }}
        working-directory: shaffy-os
        run: runuser -u tester -- env HOME=/home/tester ./bin/shaffy lint --supplement ../supplement
      - name: Run the supplement's own tests
        if: ${{ !cancelled() && hashFiles('supplement/tests/test_*.py') != '' }}
        working-directory: supplement
        run: runuser -u tester -- python3 -m unittest discover -s tests -v
      - name: Scan the history for secrets
        if: ${{ !cancelled() }}
        working-directory: supplement
        run: runuser -u tester -- gitleaks git --redact --no-banner .
      - name: Scan the submodules' history for secrets
        if: ${{ !cancelled() && hashFiles('supplement/.gitmodules') != '' }}
        working-directory: supplement
        run: runuser -u tester -- git submodule foreach --quiet --recursive 'gitleaks git --redact --no-banner .'
